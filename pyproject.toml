[project]
name = "cheapshark-mcp"
version = "0.1.0"
description = "MCP server for searching PC game deals and price history via the CheapShark API"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "cheapshark_client"]
